<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe9ff"/>
      <stop offset="55%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#fff7e6"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0053A6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.90"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFEBC0"/>
      <stop offset="100%" stop-color="#FFF7DF"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#071a3a" flood-opacity="0.22"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="1200" height="700" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="980" cy="120" r="62" fill="#22c55e" opacity="0.92" filter="url(#glow)"/>
  <circle cx="980" cy="120" r="92" fill="#22c55e" opacity="0.18"/>

  <!-- clouds -->
  <g opacity="0.55">
    <ellipse cx="210" cy="120" rx="74" ry="28" fill="#ffffff"/>
    <ellipse cx="270" cy="118" rx="56" ry="24" fill="#ffffff"/>
    <ellipse cx="165" cy="125" rx="46" ry="20" fill="#ffffff"/>
    <ellipse cx="520" cy="95" rx="70" ry="26" fill="#ffffff"/>
    <ellipse cx="575" cy="93" rx="52" ry="22" fill="#ffffff"/>
  </g>

  <!-- sea -->
  <path d="M0,330 C160,310 310,360 470,338 C640,314 770,290 920,318 C1040,340 1120,330 1200,318 L1200,700 L0,700 Z"
        fill="url(#sea)" opacity="0.96"/>

  <!-- wave highlights -->
  <path d="M0,352 C170,332 320,382 500,356 C680,330 780,308 940,336 C1050,354 1128,346 1200,336"
        fill="none" stroke="#e0f2fe" stroke-width="10" opacity="0.55" stroke-linecap="round"/>

  <path d="M0,388 C180,366 330,420 520,392 C720,364 820,344 980,372 C1090,392 1140,382 1200,372"
        fill="none" stroke="#bae6fd" stroke-width="8" opacity="0.42" stroke-linecap="round"/>

  <!-- sand -->
  <path d="M0,430 C190,450 330,430 520,452 C740,478 900,500 1200,470 L1200,700 L0,700 Z"
        fill="url(#sand)" opacity="1"/>

  <!-- court lines -->
  <g opacity="0.9" filter="url(#softShadow)">
    <rect x="240" y="455" width="720" height="190" rx="26" fill="#ffffff" opacity="0.22"/>
    <rect x="270" y="480" width="660" height="140" rx="18" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.65"/>
    <line x1="600" y1="480" x2="600" y2="620" stroke="#ffffff" stroke-width="5" opacity="0.55"/>
  </g>

  <!-- net / pole -->
  <g opacity="0.85">
    <rect x="590" y="468" width="20" height="180" rx="8" fill="#0b1630" opacity="0.55"/>
    <path d="M600,492 C600,492 520,522 420,520 C320,518 280,510 280,510"
          fill="none" stroke="#0b1630" stroke-width="3" opacity="0.45"/>
    <path d="M600,492 C600,492 680,522 780,520 C880,518 920,510 920,510"
          fill="none" stroke="#0b1630" stroke-width="3" opacity="0.45"/>
  </g>

  <!-- label pill -->
  <g filter="url(#softShadow)">
    <rect x="54" y="520" width="430" height="112" rx="30" fill="#012749" opacity="0.92"/>
    <rect x="54" y="520" width="430" height="112" rx="30" fill="#22c55e" opacity="0.10"/>
    <text x="84" y="565" font-family="Poppins, Arial, sans-serif" font-size="22" fill="#f8fafc" font-weight="700">⚽ Futevôlei</text>
    <text x="84" y="600" font-family="Poppins, Arial, sans-serif" font-size="15" fill="#cbd5e1" opacity="0.95">Visual premium • vibe praia • República da Praia</text>
  </g>
</svg>
